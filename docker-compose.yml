services:
  nbt-engine:
    build: .
    container_name: nbt-auto-runtime
    volumes:
      # 코드 동기화 (개발용)
      - .:/app
      # 백업 결과 저장 (호스트의 ~/nbt-backup에 영구 저장)
      - ~/nbt-backup:/data/backup
    environment:
      # 백업 저장 경로 (컨테이너 내부 기준)
      - NBT_BACKUP_ROOT=/data/backup
      # 타임존 설정 (폴더명 타임스탬프용)
      - TZ=Asia/Seoul
    # EVE-NG 내 장비(192.168.0.x)와 직접 통신하기 위해 호스트 네트워크 사용
    ports:
      - "8000:8000"      
    network_mode: host

    