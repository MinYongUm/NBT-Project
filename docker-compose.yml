services:

  redis:
    image: redis:7-alpine
    container_name: nbt-redis
    restart: unless-stopped
    networks:
      - nbt-net

  nbt-ollama:                                            # 추가 (v5.0)
    image: ollama/ollama
    container_name: nbt-ollama
    restart: unless-stopped
    volumes:
      - ~/nbt-ollama-models:/root/.ollama
    networks:
      - nbt-net

  nbt-chroma:                                            # 추가 (v5.1)
    image: chromadb/chroma
    container_name: nbt-chroma
    restart: unless-stopped
    volumes:
      - ~/nbt-chroma-data:/chroma/chroma
    networks:
      - nbt-net

  nbt-engine:
    build: .
    container_name: nbt-engine
    env_file: .env
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ~/nbt-backup:/data/backup
    environment:
      - NBT_BACKUP_ROOT=/data/backup
      - TZ=Asia/Seoul
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - NBT_OLLAMA_URL=http://nbt-ollama:11434          # 추가 (v5.0)
      - NBT_OLLAMA_MODEL=qwen2.5:7b                     # 수정 (v5.1)
      - NBT_CHROMA_URL=http://nbt-chroma:8000           # 추가 (v5.1)
      - NBT_EMBED_MODEL=nomic-embed-text                # 추가 (v5.1)
    depends_on:
      - redis
      - nbt-ollama                                      # 추가 (v5.0)
      - nbt-chroma                                      # 추가 (v5.1)
    networks:
      - nbt-net

  nbt-worker:
    build: .
    container_name: nbt-worker
    restart: unless-stopped
    command: celery -A core.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - .:/app
      - ~/nbt-backup:/data/backup
    environment:
      - NBT_BACKUP_ROOT=/data/backup
      - TZ=Asia/Seoul
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - nbt-net

  nbt-beat:
    build: .
    container_name: nbt-beat
    restart: unless-stopped
    command: celery -A core.celery_app beat --loglevel=info
    env_file: .env
    volumes:
      - .:/app
      - ~/nbt-backup:/data/backup
    environment:
      - NBT_BACKUP_ROOT=/data/backup
      - TZ=Asia/Seoul
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - nbt-worker
    networks:
      - nbt-net

networks:
  nbt-net:
    driver: bridge