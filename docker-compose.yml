services:

  redis:
    image: redis:7-alpine
    container_name: nbt-redis
    restart: unless-stopped
    # 작업 큐 전용 — 외부 포트 노출 불필요
    # 컨테이너 내부 네트워크(nbt-net)에서만 접근
    networks:
      - nbt-net

  nbt-engine:
    build: .
    container_name: nbt-engine
    env_file: .env 
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ~/nbt-backup:/data/backup
    environment:
      - NBT_BACKUP_ROOT=/data/backup
      - TZ=Asia/Seoul
      # Celery 브로커/백엔드 주소 (컨테이너명으로 접근)
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - nbt-net

  nbt-worker:
    build: .
    container_name: nbt-worker
    restart: unless-stopped
    # 웹 서버가 아닌 Celery 워커로 실행
    command: celery -A core.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - .:/app
      - ~/nbt-backup:/data/backup
    environment:
      - NBT_BACKUP_ROOT=/data/backup
      - TZ=Asia/Seoul
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - nbt-net

networks:
  nbt-net:
    driver: bridge