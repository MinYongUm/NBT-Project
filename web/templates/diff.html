{% extends "base.html" %}

{% block title %}Config Diff{% endblock %}

{% block head %}
<style>
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th {
    text-align: left;
    padding: 10px 14px;
    color: var(--text-muted);
    font-weight: 500;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  td {
    padding: 12px 14px;
    border-bottom: 1px solid #1f1f1f;
    font-family: var(--mono);
    font-size: 13px;
    vertical-align: middle;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #1f1f1f; }

  .toggle-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    font-size: 11px;
    padding: 3px 10px;
    cursor: pointer;
    font-family: var(--mono);
    transition: border-color 0.15s, color 0.15s;
  }
  .toggle-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .page-title {
    margin-bottom: 24px;
  }

  .limit-select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 7px 12px;
    outline: none;
    cursor: pointer;
  }

  .empty {
    text-align: center;
    padding: 48px;
    color: var(--text-muted);
    font-size: 14px;
  }

  /* ── Diff 뷰어 모달 ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open {
    display: flex;
  }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 96vw;
    max-width: 1400px;
    height: 85vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 모달 헤더 */
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 12px;
  }

  .modal-meta {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .modal-hostname {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    font-family: var(--mono);
  }

  .file-badge-prev {
    font-size: 10px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 3px;
    background: rgba(239,68,68,0.15);
    color: var(--danger);
    border: 1px solid rgba(239,68,68,0.25);
  }

  .file-badge-curr {
    font-size: 10px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 3px;
    background: rgba(34,197,94,0.12);
    color: var(--success);
    border: 1px solid rgba(34,197,94,0.25);
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 18px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    line-height: 1;
    transition: color 0.15s;
    flex-shrink: 0;
  }
  .modal-close:hover { color: var(--text); }

  /* 좌/우 컬럼 헤더 (sticky) */
  .split-header {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-bottom: 1px solid var(--border);
    background: #161616;
    flex-shrink: 0;
  }

  .split-header-cell {
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    font-family: var(--mono);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .split-header-cell:first-child {
    border-right: 1px solid var(--border);
  }

  /* 모달 바디 */
  .modal-body {
    flex: 1;
    overflow: auto;
  }

  /* ── Split View Diff 테이블 ── */
  .diff-split-table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.65;
    table-layout: fixed;
  }

  .diff-split-table td {
    padding: 1px 0;
    border-bottom: none;
    vertical-align: top;
  }

  /* 라인 번호 셀 */
  .ln {
    width: 48px;
    min-width: 48px;
    padding: 1px 10px 1px 8px !important;
    text-align: right;
    color: #444;
    user-select: none;
    font-size: 11px;
  }

  /* 코드 내용 셀 */
  .code {
    padding: 1px 12px 1px 6px !important;
    white-space: pre;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 좌우 분리선 */
  .divider {
    width: 1px;
    min-width: 1px;
    background: var(--border);
    padding: 0 !important;
  }

  /* 제거(좌측) */
  .td-remove-ln   { background: rgba(239,68,68,0.08); color: #7a3a3a; }
  .td-remove-code { background: rgba(239,68,68,0.06); color: #f0a8a8; }

  /* 추가(우측) */
  .td-add-ln   { background: rgba(34,197,94,0.08); color: #3a7a4a; }
  .td-add-code { background: rgba(34,197,94,0.06); color: #a8f0b8; }

  /* 컨텍스트 */
  .td-ctx-ln   { background: transparent; }
  .td-ctx-code { background: transparent; color: var(--text-muted); }

  /* 빈 셀 (매칭 없는 쪽) */
  .td-empty-ln   { background: #0d0d0d; }
  .td-empty-code { background: #0d0d0d; }

  /* @@ 헝크 헤더 (전체 너비) */
  .td-hunk {
    background: rgba(59,130,246,0.06);
    color: #93b4e8;
    padding: 1px 12px !important;
  }

  /* 로딩/에러 */
  .modal-status {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 200px;
    color: var(--text-muted);
    font-size: 14px;
    font-family: var(--mono);
  }
</style>
{% endblock %}

{% block content %}
<h1 class="page-title">Config Diff</h1>

<div class="controls">
  <select class="limit-select" id="limit-select" onchange="loadDiffs()">
    <option value="10">최근 10건</option>
    <option value="20">최근 20건</option>
    <option value="50">최근 50건</option>
  </select>
</div>

<div class="card">
  <table>
    <thead>
      <tr>
        <th>감지 시각</th>
        <th>호스트명</th>
        <th>IP</th>
        <th>변경 라인</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="diff-tbody">
      <tr><td colspan="5" class="empty">데이터 로딩 중...</td></tr>
    </tbody>
  </table>
</div>

<!-- Diff 뷰어 모달 -->
<div class="modal-overlay" id="diff-modal" onclick="handleOverlayClick(event)">
  <div class="modal">

    <div class="modal-header">
      <div class="modal-meta">
        <span class="modal-hostname" id="modal-hostname">—</span>

      </div>
      <button class="modal-close" onclick="closeModal()">&#10005;</button>
    </div>

    <!-- 이전 백업 / 최신 백업 컬럼 헤더 -->
    <div class="split-header">
      <div class="split-header-cell">
        이전 백업 &nbsp;<span class="file-badge-prev">PREV</span>&nbsp;
        <span id="split-prev-file" style="color:var(--text-muted);font-weight:400;"></span>
      </div>
      <div class="split-header-cell">
        최신 백업 &nbsp;<span class="file-badge-curr">CURR</span>&nbsp;
        <span id="split-curr-file" style="color:var(--text-muted);font-weight:400;"></span>
      </div>
    </div>

    <div class="modal-body" id="modal-body">
      <div class="modal-status">불러오는 중...</div>
    </div>

  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  // ------------------------------------------------------------------
  // Diff 목록 로드
  // ------------------------------------------------------------------
  let _diffData = [];

  async function loadDiffs() {
    const limit = document.getElementById('limit-select').value;
    const tbody = document.getElementById('diff-tbody');

    try {
      const res = await fetch(`/api/diff?limit=${limit}`);
      if (handle401(res)) return;
      _diffData = await res.json();

      if (!_diffData.length) {
        tbody.innerHTML =
          '<tr><td colspan="5" class="empty">Config 변경 이력이 없습니다.</td></tr>';
        return;
      }

      tbody.innerHTML = _diffData.map((d, i) => {
        const detectedAt = d.detected_at.slice(0, 19).replace('T', ' ');
        return `
          <tr>
            <td>${detectedAt}</td>
            <td>${d.hostname}</td>
            <td>${d.ip}</td>
            <td><span class="badge badge-blue">${d.diff_lines}줄</span></td>
            <td>
              <button class="toggle-btn" onclick="openDiffModal(${i})">
                Diff 보기
              </button>
            </td>
          </tr>`;
      }).join('');

    } catch (e) {
      tbody.innerHTML =
        '<tr><td colspan="5" class="empty">데이터를 불러올 수 없습니다.</td></tr>';
    }
  }

  // ------------------------------------------------------------------
  // 모달 열기 / 닫기
  // ------------------------------------------------------------------
  function openDiffModal(idx) {
    const d = _diffData[idx];
    if (!d) return;

    document.getElementById('modal-hostname').textContent =
      `${d.hostname}  ·  ${d.diff_lines}줄 변경`;

    document.getElementById('split-prev-file').textContent = 
      _shortPath(d.previous_file);
    document.getElementById('split-curr-file').textContent = 
    _shortPath(d.current_file);

    document.getElementById('modal-body').innerHTML =
      renderSplitDiff(d.diff_content || '');

    document.getElementById('diff-modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('diff-modal').classList.remove('open');
  }

  function handleOverlayClick(event) {
    if (event.target === document.getElementById('diff-modal')) {
      closeModal();
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  function _shortPath(fullPath) {
    if (!fullPath) return '—';
    const parts = fullPath.replace(/\\/g, '/').split('/');
    return parts.length >= 2 ? parts.slice(-2).join('/') : parts[parts.length - 1];
  }

  // ------------------------------------------------------------------
  // unified diff → split view 파싱
  //
  // 연속된 '-' 블록과 '+' 블록을 쌍으로 매칭하여 좌우 배치
  //   '-' 라인: 왼쪽(이전 백업) 빨간 셀
  //   '+' 라인: 오른쪽(최신 백업) 초록 셀
  //   짝이 없는 쪽: 어두운 빈 셀
  //   컨텍스트 라인: 좌우 동일 내용
  // ------------------------------------------------------------------
  function parseSplitDiff(content) {
    const lines   = content.split('\n');
    const result  = [];
    let leftLine  = 0;
    let rightLine = 0;
    let removes   = [];   // { ln, text }
    let adds      = [];   // { ln, text }

    function flushPairs() {
      const count = Math.max(removes.length, adds.length);
      for (let i = 0; i < count; i++) {
        result.push({
          type:  'change',
          left:  removes[i] || null,
          right: adds[i]    || null,
        });
      }
      removes = [];
      adds    = [];
    }

    for (const line of lines) {
      if (line.startsWith('---') || line.startsWith('+++')) {
        flushPairs();
        result.push({ type: 'meta', content: line });
        continue;
      }

      if (line.startsWith('@@')) {
        flushPairs();
        const m = line.match(/@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
        if (m) {
          leftLine  = parseInt(m[1], 10) - 1;
          rightLine = parseInt(m[2], 10) - 1;
        }
        result.push({ type: 'hunk', content: line });
        continue;
      }

      if (line.startsWith('-')) {
        leftLine++;
        removes.push({ ln: leftLine, text: line.slice(1) });
        continue;
      }

      if (line.startsWith('+')) {
        rightLine++;
        adds.push({ ln: rightLine, text: line.slice(1) });
        continue;
      }

      // 컨텍스트 라인
      flushPairs();
      leftLine++;
      rightLine++;
      result.push({
        type:  'ctx',
        left:  { ln: leftLine,  text: line.slice(1) },
        right: { ln: rightLine, text: line.slice(1) },
      });
    }

    flushPairs();
    return result;
  }

  // ------------------------------------------------------------------
  // split view HTML 렌더링
  // ------------------------------------------------------------------
  function esc(text) {
    if (text == null) return '';
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function renderSplitDiff(content) {
    if (!content) {
      return '<div class="modal-status">Diff 내용이 없습니다.</div>';
    }

    const rows = parseSplitDiff(content);

    const html = rows.map(row => {
      if (row.type === 'meta') {
        return '';
      }

      // @@ 헝크 헤더 (전체 너비)
      if (row.type === 'hunk') {
        return `<tr>
          <td class="td-hunk" colspan="5">${esc(row.content)}</td>
        </tr>`;
      }

      // 컨텍스트 (좌우 동일)
      if (row.type === 'ctx') {
        return `<tr>
          <td class="ln td-ctx-ln">${row.left.ln}</td>
          <td class="code td-ctx-code">${esc(row.left.text)}</td>
          <td class="divider"></td>
          <td class="ln td-ctx-ln">${row.right.ln}</td>
          <td class="code td-ctx-code">${esc(row.right.text)}</td>
        </tr>`;
      }

      // 변경 라인 — 좌(이전/빨간) / 우(최신/초록)
      const leftLnCls   = row.left  ? 'ln td-remove-ln'   : 'ln td-empty-ln';
      const leftCodeCls = row.left  ? 'code td-remove-code': 'code td-empty-code';
      const rightLnCls  = row.right ? 'ln td-add-ln'       : 'ln td-empty-ln';
      const rightCodeCls= row.right ? 'code td-add-code'   : 'code td-empty-code';

      return `<tr>
        <td class="${leftLnCls}">${row.left  ? row.left.ln  : ''}</td>
        <td class="${leftCodeCls}">${row.left  ? esc(row.left.text)  : ''}</td>
        <td class="divider"></td>
        <td class="${rightLnCls}">${row.right ? row.right.ln : ''}</td>
        <td class="${rightCodeCls}">${row.right ? esc(row.right.text) : ''}</td>
      </tr>`;

    }).join('');

    return `<table class="diff-split-table">
        <colgroup>
          <col style="width:52px">
          <col style="width:calc(50% - 53px)">
          <col style="width:1px">
          <col style="width:52px">
          <col style="width:calc(50% - 53px)">
        </colgroup>
      <tbody>${html}</tbody></table>`;
  }

  // ------------------------------------------------------------------
  // 초기 로드
  // ------------------------------------------------------------------
  loadDiffs();
</script>
{% endblock %}
