{% extends "base.html" %}

{% block title %}Config Diff{% endblock %}

{% block head %}
<style>
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th {
    text-align: left;
    padding: 10px 14px;
    color: var(--text-muted);
    font-weight: 500;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  td {
    padding: 12px 14px;
    border-bottom: 1px solid #1f1f1f;
    font-family: var(--mono);
    font-size: 13px;
    vertical-align: middle;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #1f1f1f; }

  .toggle-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    font-size: 11px;
    padding: 3px 10px;
    cursor: pointer;
    font-family: var(--mono);
    transition: border-color 0.15s, color 0.15s;
  }

  .toggle-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .page-title { margin-bottom: 24px; }

  .limit-select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 7px 12px;
    outline: none;
    cursor: pointer;
  }

  .empty {
    text-align: center;
    padding: 48px;
    color: var(--text-muted);
    font-size: 14px;
  }

  /* ── skeleton tbody 행 ────────────────────────────────── */
  tbody .skeleton-row td {
    border-bottom: 1px solid rgba(42, 42, 42, 0.6);
    vertical-align: middle;
  }
  tbody .skeleton-row:last-child td { border-bottom: none; }
  tbody .skeleton-row:hover td { background: transparent; }

  /* ── Diff 뷰어 <dialog> ── */
  #diff-modal {
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    color: var(--text);
    width: 96vw;
    max-width: 1400px;
    max-height: 85vh;
    inset: 0;
    margin: auto;
    flex-direction: column;
    overflow: hidden;
  }

  #diff-modal[open] { display: flex; }

  #diff-modal::backdrop { background: rgba(0, 0, 0, 0.75); }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 12px;
  }

  .modal-meta {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .modal-hostname {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    font-family: var(--mono);
  }

  .file-badge-prev {
    font-size: 10px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 3px;
    background: rgba(239,68,68,0.15);
    color: var(--danger);
    border: 1px solid rgba(239,68,68,0.25);
  }

  .file-badge-curr {
    font-size: 10px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 3px;
    background: rgba(34,197,94,0.12);
    color: var(--success);
    border: 1px solid rgba(34,197,94,0.25);
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 18px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    line-height: 1;
    transition: color 0.15s;
    flex-shrink: 0;
  }

  .modal-close:hover { color: var(--text); }

  .split-header {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-bottom: 1px solid var(--border);
    background: #161616;
    flex-shrink: 0;
  }

  .split-header-cell {
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    font-family: var(--mono);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .split-header-cell:first-child { border-right: 1px solid var(--border); }

  .modal-body { flex: 1; overflow: auto; }

  /* ── Split View Diff 테이블 ── */
  .diff-split-table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.65;
    table-layout: fixed;
  }

  .diff-split-table td {
    padding: 1px 0;
    border-bottom: none;
    vertical-align: top;
  }

  .ln {
    width: 48px;
    min-width: 48px;
    padding: 1px 10px 1px 8px !important;
    text-align: right;
    color: #444;
    user-select: none;
    font-size: 11px;
  }

  .code {
    padding: 1px 12px 1px 6px !important;
    white-space: pre;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .divider {
    width: 1px;
    min-width: 1px;
    background: var(--border);
    padding: 0 !important;
  }

  .td-remove-ln   { background: rgba(239,68,68,0.08); color: #7a3a3a; }
  .td-remove-code { background: rgba(239,68,68,0.06); color: #f0a8a8; }
  .td-add-ln      { background: rgba(34,197,94,0.08); color: #3a7a4a; }
  .td-add-code    { background: rgba(34,197,94,0.06); color: #a8f0b8; }
  .td-ctx-ln      { background: transparent; }
  .td-ctx-code    { background: transparent; color: var(--text-muted); }
  .td-empty-ln    { background: #0d0d0d; }
  .td-empty-code  { background: #0d0d0d; }

  .td-hunk {
    background: rgba(59,130,246,0.06);
    color: #93b4e8;
    padding: 1px 12px !important;
  }

  .modal-status {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 200px;
    color: var(--text-muted);
    font-size: 14px;
    font-family: var(--mono);
  }
</style>
{% endblock %}

{% block content %}
<h1 class="page-title">Config Diff</h1>

<!-- 조회 설정 -->
<section aria-label="조회 설정">

    <select class="limit-select" id="limit-select" onchange="loadDiffs()">
      <option value="10">최근 10건</option>
      <option value="20">최근 20건</option>
      <option value="50">최근 50건</option>
    </select>
  </div>
</section>

<!-- Config Diff 목록 -->
<section aria-label="Config Diff 목록" class="card">
  <table>

    </thead>
    <!-- skeleton: 5행. loadDiffs() 완료 시 tbody.innerHTML 교체로 자동 제거 -->
    <tbody id="diff-tbody">
      <tr class="skeleton-row">
        <td><div class="skeleton skeleton-cell" style="width:140px;"></div></td>
        <td><div class="skeleton skeleton-cell" style="width:120px;"></div></td>
        <td><div class="skeleton skeleton-cell" style="width:110px;"></div></td>
        <td><div class="skeleton skeleton-badge"></div></td>
        <td><div class="skeleton skeleton-cell" style="width:64px;"></div></td>
      </tr>
      <tr class="skeleton-row">
        <td><div class="skeleton skeleton-cell" style="width:140px;"></div></td>
        <td><div class="skeleton skeleton-cell" style="width:100px;"></div></td>
        <td><div class="skeleton skeleton-cell" style="width:110px;"></div></td>
        <td><div class="skeleton skeleton-badge"></div></td>
        <td><div class="skeleton skeleton-cell" style="width:64px;"></div></td>
      </tr>
      <tr class="skeleton-row">
        <td><div class="skeleton skeleton-cell" style="width:140px;"></div></td>
        <td><div class="skeleton skeleton-cell" style="width:130px;"></div></td>
        <td><div class="skeleton skeleton-cell" style="width:110px;"></div></td>
        <td><div class="skeleton skeleton-badge"></div></td>
        <td><div class="skeleton skeleton-cell" style="width:64px;"></div></td>
      </tr>
      <tr class="skeleton-row">
        <td><div class="skeleton skeleton-cell" style="width:140px;"></div></td>
        <td><div class="skeleton skeleton-cell" style="width:108px;"></div></td>
        <td><div class="skeleton skeleton-cell" style="width:110px;"></div></td>
        <td><div class="skeleton skeleton-badge"></div></td>
        <td><div class="skeleton skeleton-cell" style="width:64px;"></div></td>
      </tr>
      <tr class="skeleton-row">
        <td><div class="skeleton skeleton-cell" style="width:140px;"></div></td>
        <td><div class="skeleton skeleton-cell" style="width:116px;"></div></td>
        <td><div class="skeleton skeleton-cell" style="width:110px;"></div></td>
        <td><div class="skeleton skeleton-badge"></div></td>
        <td><div class="skeleton skeleton-cell" style="width:64px;"></div></td>
      </tr>
    </tbody>
  </table>
</section>

<!-- Diff 뷰어 모달 — <dialog> semantic tag -->
<dialog id="diff-modal">
  <header class="modal-header">
    <div class="modal-meta">
      <span class="modal-hostname" id="modal-hostname">—</span>
    </div>
    <button class="modal-close" onclick="closeModal()">&#10005;</button>
  </header>

  <div class="split-header">
    <div class="split-header-cell">
      이전 백업 &nbsp;<span class="file-badge-prev">PREV</span>&nbsp;
      <span id="split-prev-file" style="color:var(--text-muted);font-weight:400;"></span>
    </div>
    <div class="split-header-cell">
      최신 백업 &nbsp;<span class="file-badge-curr">CURR</span>&nbsp;
      <span id="split-curr-file" style="color:var(--text-muted);font-weight:400;"></span>
    </div>
  </div>

  <div class="modal-body" id="modal-body">
    <div class="modal-status">불러오는 중...</div>
  </div>
</dialog>
{% endblock %}

{% block scripts %}
<script>
  // ------------------------------------------------------------------
  // Diff 목록 로드
  // ------------------------------------------------------------------
  let _diffData = [];

  const diffModal = document.getElementById('diff-modal');

  // skeleton 행 템플릿 (limit-select 변경 시 재사용)
  const SKEL_ROW = `
    <tr class="skeleton-row">
      <td><div class="skeleton skeleton-cell" style="width:140px;"></div></td>
      <td><div class="skeleton skeleton-cell" style="width:120px;"></div></td>
      <td><div class="skeleton skeleton-cell" style="width:110px;"></div></td>
      <td><div class="skeleton skeleton-badge"></div></td>
      <td><div class="skeleton skeleton-cell" style="width:64px;"></div></td>
    </tr>`;

  async function loadDiffs() {
    const limit = document.getElementById('limit-select').value;
    const tbody = document.getElementById('diff-tbody');

    // limit-select 변경 시 skeleton rows 재삽입 (재로딩 피드백)
    tbody.innerHTML = SKEL_ROW.repeat(Math.min(parseInt(limit), 5));

    try {
      const res = await fetch(`/api/diff?limit=${limit}`);
      if (handle401(res)) return;
      _diffData = await res.json();

      if (!_diffData.length) {
        tbody.innerHTML =
          '<tr><td colspan="5" class="empty">Config 변경 이력이 없습니다.</td></tr>';
        return;
      }

      tbody.innerHTML = _diffData.map((d, i) => {
        const detectedAt = d.detected_at.slice(0, 19).replace('T', ' ');
        return `
          <tr>
            <td>${detectedAt}</td>
            <td>${d.hostname}</td>
            <td>${d.ip}</td>
            <td><span class="badge badge-blue">${d.diff_lines}줄</span></td>
            <td>
              <button class="toggle-btn" onclick="openDiffModal(${i})">
                Diff 보기
              </button>
            </td>
          </tr>`;
      }).join('');

    } catch (e) {
      tbody.innerHTML =
        '<tr><td colspan="5" class="empty">데이터를 불러올 수 없습니다.</td></tr>';
    }
  }

  // ------------------------------------------------------------------
  // 모달 열기 / 닫기 — <dialog> API
  // ------------------------------------------------------------------
  function openDiffModal(idx) {
    const d = _diffData[idx];
    if (!d) return;

    document.getElementById('modal-hostname').textContent =
      `${d.hostname}  ·  ${d.diff_lines}줄 변경`;
    document.getElementById('split-prev-file').textContent = _shortPath(d.previous_file);
    document.getElementById('split-curr-file').textContent = _shortPath(d.current_file);
    document.getElementById('modal-body').innerHTML = renderSplitDiff(d.diff_content || '');

    diffModal.showModal();
  }

  function closeModal() {
    diffModal.close();
  }

  // ::backdrop 클릭 시 닫기
  diffModal.addEventListener('click', e => {
    const rect = diffModal.getBoundingClientRect();
    const isOutside =
      e.clientX < rect.left  || e.clientX > rect.right ||
      e.clientY < rect.top   || e.clientY > rect.bottom;
    if (isOutside) closeModal();
  });

  // ESC 는 <dialog> 기본 처리
  diffModal.addEventListener('cancel', () => {});

  function _shortPath(fullPath) {
    if (!fullPath) return '—';
    const parts = fullPath.replace(/\\/g, '/').split('/');
    return parts.length >= 2 ? parts.slice(-2).join('/') : parts[parts.length - 1];
  }

  // ------------------------------------------------------------------
  // unified diff → split view 파싱
  // ------------------------------------------------------------------
  function parseSplitDiff(content) {
    const lines   = content.split('\n');
    const result  = [];
    let leftLine  = 0;
    let rightLine = 0;
    let removes   = [];
    let adds      = [];

    function flushPairs() {
      const count = Math.max(removes.length, adds.length);
      for (let i = 0; i < count; i++) {
        result.push({ type: 'change', left: removes[i] || null, right: adds[i] || null });
      }
      removes = [];
      adds    = [];
    }

    for (const line of lines) {
      if (line.startsWith('---') || line.startsWith('+++')) {
        flushPairs();
        result.push({ type: 'meta', content: line });
        continue;
      }

      if (line.startsWith('@@')) {
        flushPairs();
        const m = line.match(/@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
        if (m) {
          leftLine  = parseInt(m[1], 10) - 1;
          rightLine = parseInt(m[2], 10) - 1;
        }
        result.push({ type: 'hunk', content: line });
        continue;
      }

      if (line.startsWith('-')) {
        leftLine++;
        removes.push({ ln: leftLine, text: line.slice(1) });
        continue;
      }

      if (line.startsWith('+')) {
        rightLine++;
        adds.push({ ln: rightLine, text: line.slice(1) });
        continue;
      }

      flushPairs();
      leftLine++;
      rightLine++;
      result.push({
        type:  'ctx',
        left:  { ln: leftLine,  text: line.slice(1) },
        right: { ln: rightLine, text: line.slice(1) },
      });
    }

    flushPairs();
    return result;
  }

  // ------------------------------------------------------------------
  // split view HTML 렌더링
  // ------------------------------------------------------------------
  function esc(text) {
    if (text == null) return '';
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function renderSplitDiff(content) {
    if (!content) return '<div class="modal-status">Diff 내용이 없습니다.</div>';

    const rows = parseSplitDiff(content);

    const html = rows.map(row => {
      if (row.type === 'meta') return '';

      if (row.type === 'hunk') {
        return `<tr><td class="td-hunk" colspan="5">${esc(row.content)}</td></tr>`;
      }

      if (row.type === 'ctx') {
        return `<tr>
          <td class="ln td-ctx-ln">${row.left.ln}</td>
          <td class="code td-ctx-code">${esc(row.left.text)}</td>
          <td class="divider"></td>
          <td class="ln td-ctx-ln">${row.right.ln}</td>
          <td class="code td-ctx-code">${esc(row.right.text)}</td>
        </tr>`;
      }

      const leftLnCls    = row.left  ? 'ln td-remove-ln'    : 'ln td-empty-ln';
      const leftCodeCls  = row.left  ? 'code td-remove-code' : 'code td-empty-code';
      const rightLnCls   = row.right ? 'ln td-add-ln'        : 'ln td-empty-ln';
      const rightCodeCls = row.right ? 'code td-add-code'    : 'code td-empty-code';

      return `<tr>
        <td class="${leftLnCls}">${row.left  ? row.left.ln  : ''}</td>
        <td class="${leftCodeCls}">${row.left  ? esc(row.left.text)  : ''}</td>
        <td class="divider"></td>
        <td class="${rightLnCls}">${row.right ? row.right.ln : ''}</td>
        <td class="${rightCodeCls}">${row.right ? esc(row.right.text) : ''}</td>
      </tr>`;
    }).join('');

    return `<table class="diff-split-table">
      <colgroup>
        <col style="width:52px">
        <col style="width:calc(50% - 53px)">
        <col style="width:1px">
        <col style="width:52px">
        <col style="width:calc(50% - 53px)">
      </colgroup>
      <tbody>${html}</tbody>
    </table>`;
  }

  // ------------------------------------------------------------------
  // 초기 로드
  // ------------------------------------------------------------------
  loadDiffs();
</script>
{% endblock %}
