{% extends "base.html" %}
{% block title %}장비 관리{% endblock %}

{% block head %}
<style>
  .devices-layout {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }

  .devices-main { flex: 1; min-width: 0; }

  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    font-family: 'Pretendard', sans-serif;
    cursor: pointer;
    border: none;
    transition: opacity 0.15s, background 0.15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { color: var(--text); border-color: #444; opacity: 1; }
  .btn-danger-ghost {
    background: transparent;
    color: var(--danger);
    border: 1px solid rgba(239,68,68,0.3);
    padding: 4px 10px;
    font-size: 12px;
  }
  .btn-danger-ghost:hover { background: rgba(239,68,68,0.08); opacity: 1; }

  .btn-icon {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    width: 28px;
    height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    padding: 0;
  }
  .btn-icon:hover { background: #2a2a2a; color: var(--text); border-color: #444; }
  .btn-icon.danger:hover {
    background: rgba(239,68,68,0.08);
    color: var(--danger);
    border-color: rgba(239,68,68,0.3);
  }

  .filter-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .filter-group { display: flex; gap: 6px; }

  .btn-filter {
    padding: 5px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    font-family: var(--mono);
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .btn-filter:hover { color: var(--text); border-color: #444; }
  .btn-filter.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .search-input-wrap { position: relative; margin-left: auto; }

  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 13px;
    pointer-events: none;
  }

  .search-input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 12px;
    font-family: var(--mono);
    padding: 6px 12px 6px 30px;
    width: 200px;
    outline: none;
    transition: border-color 0.15s, width 0.2s;
  }
  .search-input:focus { border-color: var(--accent); width: 240px; }
  .search-input::placeholder { color: #555; }

  .result-count {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 8px;
    min-height: 18px;
  }

  .table-box {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .table-col-header {
    display: flex;
    align-items: center;
    padding: 8px 16px;
    background: #111;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    font-weight: 600;
    color: #555;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .table-scroll {
    max-height: 520px;
    overflow-y: auto;
  }
  .table-scroll::-webkit-scrollbar { width: 6px; }
  .table-scroll::-webkit-scrollbar-track { background: transparent; }
  .table-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

  .device-row {
    display: flex;
    align-items: center;
    padding: 9px 16px;
    border-bottom: 1px solid #1a1a1a;
    font-size: 13px;
    font-family: var(--mono);
    transition: background 0.1s;
    cursor: pointer;
  }
  .device-row:last-child { border-bottom: none; }
  .device-row:hover { background: #161616; }
  .device-row.selected { background: rgba(59,130,246,0.07); }

  .col-group    { width: 80px;  flex-shrink: 0; text-align: center; }
  .col-hostname { width: 120px; flex-shrink: 0; text-align: center; color: var(--text); }
  .col-ip       { width: 150px; flex-shrink: 0; text-align: center; color: #888; }
  .col-type     { width: 120px; flex-shrink: 0; text-align: center; color: #555; }
  .col-desc     { flex: 1; text-align: center; color: #555; font-size: 12px; }
  .col-actions  { width: 72px;  flex-shrink: 0; text-align: center; }

  .table-col-header .col-hostname,
  .table-col-header .col-ip,
  .table-col-header .col-type,
  .table-col-header .col-desc { color: #555; }

  mark {
    background: rgba(59,130,246,0.25);
    color: var(--text);
    border-radius: 2px;
    padding: 0 1px;
  }

  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    font-family: var(--mono);
    text-transform: uppercase;
  }
  .badge-mgmt  { background: #1a2a1e; color: #4ade80; }
  .badge-nexus { background: #1e1a2a; color: #a78bfa; }
  .badge-aci   { background: #2a1e1a; color: #fb923c; }
  .badge-other { background: #1e2a3a; color: var(--accent); }

  .empty-state {
    padding: 48px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }

  /* ── skeleton device-row ── */
  .skeleton-device-row {
    display: flex;
    align-items: center;
    padding: 9px 16px;
    border-bottom: 1px solid #1a1a1a;
    gap: 0;
  }
  .skeleton-device-row:last-child { border-bottom: none; }

  /* ── 우측 슬라이드 패널 — <aside> ── */
  .side-panel {
    width: 320px;
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    position: sticky;
    top: 36px;
    display: none;
  }
  .side-panel.open { display: block; }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .panel-title { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }

  .panel-close {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 18px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    line-height: 1;
    transition: color 0.15s;
  }
  .panel-close:hover { color: var(--text); }

  .form-group { margin-bottom: 16px; }

  .form-label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  .form-input,
  .form-select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    font-family: 'Pretendard', sans-serif;
    padding: 9px 12px;
    outline: none;
    transition: border-color 0.15s;
    box-sizing: border-box;
  }
  .form-input:focus,
  .form-select:focus { border-color: var(--accent); }
  .form-input::placeholder { color: #555; }
  .form-select option { background: var(--surface); color: var(--text); }

  .form-actions {
    display: flex;
    gap: 8px;
    margin-top: 24px;
  }
  .form-actions .btn { flex: 1; justify-content: center; }

  .form-error {
    display: none;
    font-size: 12px;
    color: var(--danger);
    margin-top: 12px;
    padding: 8px 12px;
    background: rgba(239,68,68,0.08);
    border-radius: 6px;
    border: 1px solid rgba(239,68,68,0.2);
  }
  .form-error.show { display: block; }

  .delete-confirm {
    display: none;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .delete-confirm.show { display: block; }
  .delete-confirm p {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .delete-confirm p strong {
    color: var(--danger);
    font-family: var(--mono);
  }

  /* ================================================================
     반응형 — v5.3
     ================================================================ */

  /* ── 태블릿 (768px ~ 1024px) ── */
  @media (max-width: 1024px) {
    /* hostname, desc 컬럼 숨김 */
    .col-hostname { display: none; }
    .col-desc     { display: none; }

    /* IP 컬럼 너비 확장 */
    .col-ip   { width: 130px; }
    .col-type { width: 110px; }

    /* 슬라이드 패널 너비 축소 */
    .side-panel { width: 280px; padding: 18px; }

    /* 검색 인풋 너비 축소 */
    .search-input       { width: 160px; }
    .search-input:focus { width: 190px; }
  }

  /* ── 모바일 (768px 미만) ── */
  @media (max-width: 768px) {
    /* 1열 레이아웃 */
    .devices-layout { flex-direction: column; }
    .devices-main   { width: 100%; }

    /* type 컬럼 추가 숨김 → 그룹 + IP + 작업만 표시 */
    .col-type { display: none; }

    /* IP 컬럼 flex:1로 확장 */
    .col-ip { width: auto; flex: 1; text-align: left; }

    /* page-header: 세로 정렬 */
    .page-header {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 20px;
    }

    /* filter-bar: 검색 인풋 full width */
    .filter-bar { flex-direction: column; align-items: stretch; gap: 8px; }
    .search-input-wrap { margin-left: 0; }
    .search-input       { width: 100%; }
    .search-input:focus { width: 100%; }

    /* aside 패널: 오버레이로 전환 */
    .side-panel {
      position: fixed;
      top: 0;
      right: -100%;
      width: 100%;
      max-width: 360px;
      height: 100vh;
      border-radius: 0;
      border-left: 1px solid var(--border);
      z-index: 200;
      overflow-y: auto;
      transition: right 0.25s ease;
      display: block;        /* 항상 DOM에 존재 — right로 숨김 */
    }
    .side-panel.open { right: 0; }

    /* 패널 열릴 때 배경 딤 처리 */
    .panel-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 199;
    }
    .panel-backdrop.show { display: block; }
  }
</style>
{% endblock %}

{% block scripts %}
<script>
  let _mode        = 'add';
  let _editId      = null;
  let _allDevices  = [];
  let _activeGroup = 'all';

  const SKEL_DEVICE_ROW = `
    <div class="skeleton-device-row">
      <span class="col-group"><div class="skeleton skeleton-badge"></div></span>
      <span class="col-hostname"><div class="skeleton skeleton-cell" style="width:88px; height:13px;"></div></span>
      <span class="col-ip"><div class="skeleton skeleton-cell" style="width:110px; height:13px;"></div></span>
      <span class="col-type"><div class="skeleton skeleton-cell" style="width:90px; height:13px;"></div></span>
      <span class="col-desc"><div class="skeleton skeleton-cell" style="width:110px; height:13px;"></div></span>
      <span class="col-actions"><div class="skeleton skeleton-cell" style="width:56px; height:22px; border-radius:6px;"></div></span>
    </div>`;

  document.addEventListener('DOMContentLoaded', loadDevices);

  async function loadDevices() {
    try {
      const res = await fetch('/api/devices');
      if (handle401(res)) return;
      _allDevices = await res.json();
      applyFilter();
    } catch (e) {
      document.getElementById('device-list').innerHTML =
        '<div class="empty-state">장비 목록을 불러오지 못했습니다.</div>';
    }
  }

  function setGroupFilter(group) {
    _activeGroup = group;
    document.querySelectorAll('.btn-filter').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.group === group);
    });
    document.getElementById('device-list').innerHTML = SKEL_DEVICE_ROW.repeat(4);
    applyFilter();
  }

  function applyFilter() {
    const keyword  = document.getElementById('ip-search').value.trim().toLowerCase();
    const filtered = _allDevices.filter(d => {
      const groupMatch = _activeGroup === 'all' || d.group_name === _activeGroup;
      const ipMatch    = keyword === '' || d.ip.toLowerCase().includes(keyword);
      return groupMatch && ipMatch;
    });
    renderList(filtered, keyword);
    updateResultCount(filtered.length, _allDevices.length);
  }

  function badgeClass(group) {
    const map = { mgmt: 'badge-mgmt', nexus: 'badge-nexus', aci: 'badge-aci' };
    return map[group] || 'badge-other';
  }

  function highlightIP(ip, keyword) {
    if (!keyword) return ip;
    const idx = ip.toLowerCase().indexOf(keyword);
    if (idx === -1) return ip;
    return (
      ip.slice(0, idx) +
      `<mark>${ip.slice(idx, idx + keyword.length)}</mark>` +
      ip.slice(idx + keyword.length)
    );
  }

  function renderList(devices, keyword = '') {
    const container = document.getElementById('device-list');

    if (!devices.length) {
      const msg = _allDevices.length === 0
        ? '등록된 장비가 없습니다. 장비 추가 버튼을 눌러 추가하세요.'
        : '검색 조건에 맞는 장비가 없습니다.';
      container.innerHTML = `<div class="empty-state">${msg}</div>`;
      return;
    }

    container.innerHTML = devices.map(d => `
      <div class="device-row" data-id="${d.id}" onclick="handleRowClick(${d.id})">
        <span class="col-group">
          <span class="badge ${badgeClass(d.group_name)}">${d.group_name}</span>
        </span>
        <span class="col-hostname">${d.last_hostname || '–'}</span>
        <span class="col-ip">${highlightIP(d.ip, keyword)}</span>
        <span class="col-type">${d.device_type}</span>
        <span class="col-desc">${d.description || '–'}</span>
        <span class="col-actions">
          <div style="display:flex;gap:6px;justify-content:center;"
               onclick="event.stopPropagation()">
            <button class="btn-icon" title="수정"
                    onclick="openEditPanel(${d.id},'${d.group_name}','${d.device_type}','${d.ip}','${(d.description||'').replace(/'/g,"\\'")}')">
              ✎
            </button>
            <button class="btn-icon danger" title="비활성화"
                    onclick="openDeactivate(${d.id},'${d.ip}')">
              ✕
            </button>
          </div>
        </span>
      </div>
    `).join('');
  }

  function updateResultCount(filtered, total) {
    document.getElementById('result-count').textContent = filtered === total
      ? `총 ${total}대`
      : `${filtered}대 / 전체 ${total}대`;
  }

  function handleRowClick(id) {
    document.querySelectorAll('.device-row').forEach(r => r.classList.remove('selected'));
    const row = document.querySelector(`.device-row[data-id="${id}"]`);
    if (row) row.classList.add('selected');
  }

  // ── 패널 backdrop 헬퍼 ──
  function showBackdrop() {
    document.getElementById('panel-backdrop').classList.add('show');
  }
  function hideBackdrop() {
    document.getElementById('panel-backdrop').classList.remove('show');
  }

  function openAddPanel() {
    _mode = 'add';
    _editId = null;
    document.getElementById('panel-title').textContent = '장비 추가';
    document.getElementById('btn-submit').textContent  = '추가';
    document.getElementById('f-group').value  = 'mgmt';
    document.getElementById('f-type').value   = 'cisco_ios';
    document.getElementById('f-ip').value     = '';
    document.getElementById('f-desc').value   = '';
    document.getElementById('delete-confirm').classList.remove('show');
    hideError();
    document.getElementById('side-panel').classList.add('open');
    showBackdrop();
  }

  function openEditPanel(id, group, type, ip, desc) {
    _mode = 'edit';
    _editId = id;
    document.getElementById('panel-title').textContent = '장비 수정';
    document.getElementById('btn-submit').textContent  = '저장';
    document.getElementById('f-group').value  = group;
    document.getElementById('f-type').value   = type;
    document.getElementById('f-ip').value     = ip;
    document.getElementById('f-desc').value   = desc;
    document.getElementById('delete-confirm').classList.remove('show');
    hideError();
    document.getElementById('side-panel').classList.add('open');
    showBackdrop();
  }

  function openDeactivate(id, ip) {
    openEditPanel(id, '', '', ip, '');
    document.getElementById('confirm-ip').textContent = ip;
    document.getElementById('delete-confirm').classList.add('show');
  }

  function closePanel() {
    document.getElementById('side-panel').classList.remove('open');
    document.querySelectorAll('.device-row').forEach(r => r.classList.remove('selected'));
    hideError();
    hideBackdrop();
    _editId = null;
  }

  async function submitForm() {
    const body = {
      group_name:  document.getElementById('f-group').value,
      device_type: document.getElementById('f-type').value,
      ip:          document.getElementById('f-ip').value.trim(),
      description: document.getElementById('f-desc').value.trim(),
    };

    if (!body.ip) { showError('IP 주소를 입력하세요.'); return; }

    const url    = _mode === 'add' ? '/api/devices' : `/api/devices/${_editId}`;
    const method = _mode === 'add' ? 'POST' : 'PUT';

    try {
      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (handle401(res)) return;
      if (res.ok) {
        closePanel();
        await loadDevices();
      } else {
        const data = await res.json();
        showError(data.detail || '저장에 실패했습니다.');
      }
    } catch (e) {
      showError('서버와 통신할 수 없습니다.');
    }
  }

  async function confirmDeactivate() {
    if (!_editId) return;
    try {
      const res = await fetch(`/api/devices/${_editId}`, { method: 'DELETE' });
      if (handle401(res)) return;
      if (res.ok) {
        closePanel();
        await loadDevices();
      } else {
        const data = await res.json();
        showError(data.detail || '비활성화에 실패했습니다.');
      }
    } catch (e) {
      showError('서버와 통신할 수 없습니다.');
    }
  }

  function showError(msg) {
    const el = document.getElementById('form-error');
    el.textContent = msg;
    el.classList.add('show');
  }

  function hideError() {
    document.getElementById('form-error').classList.remove('show');
  }
</script>
{% endblock %}
