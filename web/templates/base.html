<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}NBT{% endblock %} — Network Backup Tools</title>

  <!-- Pretendard -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <!-- Geist Mono -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-mono/style.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f0f0f;
      --surface:   #1a1a1a;
      --border:    #2a2a2a;
      --accent:    #3b82f6;
      --text:      #e5e5e5;
      --text-muted:#888;
      --success:   #22c55e;
      --danger:    #ef4444;
      --mono:      'Geist Mono', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', sans-serif;
      display: flex;
      min-height: 100vh;
    }

    /* ── 사이드바 ── */
    .sidebar {
      width: 220px;
      min-height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 0;
      position: fixed;
      top: 0; left: 0;
    }

    .sidebar-logo {
      padding: 0 20px 24px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-logo .logo-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .sidebar-logo .logo-version {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      margin-top: 4px;
    }

    .sidebar-nav {
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }

    .nav-item:hover {
      background: #242424;
      color: var(--text);
    }

    .nav-item.active {
      background: rgba(59, 130, 246, 0.12);
      color: var(--accent);
    }

    .nav-icon { font-size: 16px; }

    /* ── 메인 콘텐츠 ── */
    .main {
      margin-left: 220px;
      flex: 1;
      padding: 36px 40px;
    }

    .page-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 28px;
      letter-spacing: -0.5px;
    }

    /* ── 카드 ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }

    /* ── 뱃지 ── */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
    }
    .badge-success { background: rgba(34,197,94,0.12); color: var(--success); }
    .badge-danger  { background: rgba(239,68,68,0.12);  color: var(--danger); }
    .badge-blue    { background: rgba(59,130,246,0.12); color: var(--accent); }
  </style>

  {% block head %}{% endblock %}
</head>
<body>

  <!-- 사이드바 -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-title">Network Backup Tools</div>
      <div class="logo-version">v4.2</div>
    </div>
    <nav class="sidebar-nav">
      <a href="/" class="nav-item {% if active == 'dashboard' %}active{% endif %}">
        <span class="nav-icon">&#9632;</span> 대시보드
      </a>
      <a href="/backup" class="nav-item {% if active == 'backup' %}active{% endif %}">
        <span class="nav-icon">&#9654;</span> 백업 실행
      </a>
      <a href="/history" class="nav-item {% if active == 'history' %}active{% endif %}">
        <span class="nav-icon">&#9776;</span> 백업 이력
      </a>
      <a href="/diff" class="nav-item {% if active == 'diff' %}active{% endif %}">
        <span class="nav-icon">&#177;</span> Config Diff
      </a>
      <a href="/devices" class="nav-item {% if active == 'devices' %}active{% endif %}">
        <span class="nav-icon">&#9641;</span> 장비 관리
      </a>
    </nav>
  </aside>

  <!-- 메인 -->
  <main class="main">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}

</body>
</html>
