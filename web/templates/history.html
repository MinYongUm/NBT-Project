{% extends "base.html" %}

{% block title %}백업 이력{% endblock %}

{% block head %}
<style>
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th {
    text-align: left;
    padding: 10px 14px;
    color: var(--text-muted);
    font-weight: 500;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  td {
    padding: 12px 14px;
    border-bottom: 1px solid #1f1f1f;
    font-family: var(--mono);
    font-size: 13px;
    vertical-align: top;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #1f1f1f; }

  .detail-row td {
    background: #111;
    padding: 0 14px;
    border-bottom: 1px solid var(--border);
  }

  .detail-table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 12px;
  }

  .detail-table th {
    font-size: 11px;
    padding: 6px 10px;
    border-bottom: 1px solid #2a2a2a;
    text-transform: uppercase;
  }

  .detail-table td {
    padding: 8px 10px;
    border-bottom: 1px solid #1a1a1a;
    font-size: 12px;
  }

  .toggle-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    font-size: 11px;
    padding: 3px 10px;
    cursor: pointer;
    font-family: var(--mono);
    transition: border-color 0.15s, color 0.15s;
  }

  .toggle-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn-view-file {
    background: none;
    border: 1px solid rgba(59,130,246,0.35);
    border-radius: 6px;
    color: var(--accent);
    font-size: 11px;
    padding: 3px 10px;
    cursor: pointer;
    font-family: var(--mono);
    transition: background 0.15s, border-color 0.15s;
  }

  .btn-view-file:hover {
    background: rgba(59,130,246,0.1);
    border-color: var(--accent);
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .page-title { margin-bottom: 24px; }

  .limit-select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 7px 12px;
    outline: none;
    cursor: pointer;
  }

  .empty {
    text-align: center;
    padding: 48px;
    color: var(--text-muted);
    font-size: 14px;
  }

  /* ── 파일 뷰어 <dialog> ── */
  #file-modal {
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    color: var(--text);
    width: 90vw;
    max-width: 960px;
    max-height: 80vh;
    /* showModal()이 position:fixed를 자동 적용 → inset+margin으로 중앙 배치 */
    inset: 0;
    margin: auto;
    flex-direction: column;
    overflow: hidden;
    /* display는 [open] 상태에서만 flex로 설정 — 기본값은 브라우저 none 유지 */
  }

  #file-modal[open] {
    display: flex;
  }

  /* ::backdrop — dialog 내장 배경 처리 */
  #file-modal::backdrop {
    background: rgba(0, 0, 0, 0.75);
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .modal-title {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 80%;
  }

  .modal-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 18px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    line-height: 1;
    transition: color 0.15s;
  }

  .modal-close:hover { color: var(--text); }

  /* 검색 바 */
  .modal-search-wrap {
    position: relative;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .modal-search {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 7px 80px 7px 12px;
    outline: none;
    transition: border-color 0.15s;
    box-sizing: border-box;
  }

  .modal-search:focus { border-color: var(--accent); }
  .modal-search::placeholder { color: #555; }

  .search-nav {
    position: absolute;
    right: 28px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .search-count {
    font-size: 11px;
    color: var(--text-muted);
    font-family: var(--mono);
    min-width: 48px;
    text-align: right;
  }

  .nav-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-muted);
    font-size: 11px;
    padding: 2px 6px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }

  .nav-btn:hover { color: var(--text); border-color: #444; }

  .modal-body {
    flex: 1;
    overflow: auto;
    padding: 0;
  }

  .file-content {
    margin: 0;
    padding: 16px 20px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.65;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-all;
  }

  .file-content mark {
    background: rgba(59,130,246,0.3);
    color: var(--text);
    border-radius: 2px;
  }

  .file-content mark.current {
    background: rgba(250,204,21,0.5);
    color: var(--text);
  }

  .modal-status {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-muted);
    font-size: 14px;
    font-family: var(--mono);
  }
</style>
{% endblock %}

{% block content %}
<h1 class="page-title">백업 이력</h1>

<!-- 조회 설정 -->
<section aria-label="조회 설정">
  <div class="controls">
    <select class="limit-select" id="limit-select" onchange="loadHistory()">
      <option value="5">최근 5회</option>
      <option value="10">최근 10회</option>
      <option value="20">최근 20회</option>
      <option value="50">최근 50회</option>
    </select>
  </div>
</section>

<!-- 백업 이력 목록 -->
<section aria-label="백업 이력 목록" class="card">
  <table>
    <thead>
      <tr>
        <th>RUN #</th>
        <th>실행 시각</th>
        <th>완료 시각</th>
        <th>전체</th>
        <th>성공</th>
        <th>실패</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="history-tbody">
      <tr><td colspan="7" class="empty">데이터 로딩 중...</td></tr>
    </tbody>
  </table>
</section>

<!-- 파일 뷰어 모달 — <dialog> semantic tag -->
<dialog id="file-modal">
  <header class="modal-header">
    <span class="modal-title" id="modal-title">—</span>
    <div class="modal-actions">
      <button class="modal-close" onclick="closeModal()">&#10005;</button>
    </div>
  </header>

  <!-- 인라인 검색 -->
  <div class="modal-search-wrap">
    <input
      class="modal-search"
      id="modal-search"
      type="text"
      placeholder="파일 내에서 검색... (Enter: 다음)"
      oninput="onSearchInput()"
      onkeydown="onSearchKeydown(event)"
      autocomplete="off"
    />
    <div class="search-nav">
      <span class="search-count" id="search-count"></span>
      <button class="nav-btn" onclick="navigateSearch(-1)">&#9650;</button>
      <button class="nav-btn" onclick="navigateSearch(1)">&#9660;</button>
    </div>
  </div>

  <div class="modal-body" id="modal-body">
    <div class="modal-status">불러오는 중...</div>
  </div>
</dialog>
{% endblock %}

{% block scripts %}
<script>
  // ------------------------------------------------------------------
  // 이력 로드
  // ------------------------------------------------------------------
  async function loadHistory() {
    const limit = document.getElementById('limit-select').value;
    const tbody = document.getElementById('history-tbody');

    try {
      const res = await fetch(`/api/history?limit=${limit}`);
      if (handle401(res)) return;
      const runs = await res.json();

      if (!runs.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty">백업 이력이 없습니다.</td></tr>';
        return;
      }

      tbody.innerHTML = runs.map(r => {
        const runAt     = r.run_at.slice(0, 19).replace('T', ' ');
        const finAt     = r.finished_at ? r.finished_at.slice(0, 19).replace('T', ' ') : '—';
        const failBadge = r.fail > 0
          ? `<span class="badge badge-danger">${r.fail}</span>`
          : `<span class="badge badge-success">0</span>`;
        return `
          <tr>
            <td>#${r.run_id}</td>
            <td>${runAt}</td>
            <td>${finAt}</td>
            <td>${r.total}</td>
            <td><span class="badge badge-success">${r.success}</span></td>
            <td>${failBadge}</td>
            <td>
              <button class="toggle-btn" onclick="toggleDetail(${r.run_id}, this)">
                상세 보기
              </button>
            </td>
          </tr>
          <tr class="detail-row" id="detail-${r.run_id}" style="display:none;">
            <td colspan="7">
              <div id="detail-content-${r.run_id}">로딩 중...</div>
            </td>
          </tr>`;
      }).join('');

    } catch (e) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty">데이터를 불러올 수 없습니다.</td></tr>';
    }
  }

  async function toggleDetail(runId, btn) {
    const row      = document.getElementById(`detail-${runId}`);
    const isHidden = row.style.display === 'none';

    if (isHidden) {
      row.style.display = 'table-row';
      btn.textContent   = '접기';

      const content = document.getElementById(`detail-content-${runId}`);
      if (content.textContent === '로딩 중...') {
        try {
          const res     = await fetch(`/api/history/${runId}`);
          if (handle401(res)) return;
          const results = await res.json();
          content.innerHTML = `
            <table class="detail-table">
              <thead>
                <tr>
                  <th>호스트명</th>
                  <th>IP</th>
                  <th>device_type</th>
                  <th>상태</th>
                  <th>소요 시간</th>
                  <th>오류</th>
                  <th>백업 파일</th>
                </tr>
              </thead>
              <tbody>
                ${results.map(r => `
                  <tr>
                    <td>${r.hostname || '—'}</td>
                    <td>${r.ip}</td>
                    <td>${r.device_type || '—'}</td>
                    <td>
                      <span class="badge ${r.status === 'SUCCESS' ? 'badge-success' : 'badge-danger'}">
                        ${r.status}
                      </span>
                    </td>
                    <td>${r.duration_sec ? r.duration_sec.toFixed(1) + 's' : '—'}</td>
                    <td>${r.error_msg || '—'}</td>
                    <td>
                      ${r.file_path
                        ? `<button class="btn-view-file"
                                   onclick="openFileModal('${r.file_path.replace(/'/g, "\\'")}', '${(r.hostname || r.ip).replace(/'/g, "\\'")}')">
                             보기
                           </button>`
                        : '—'
                      }
                    </td>
                  </tr>`).join('')}
              </tbody>
            </table>`;
        } catch (e) {
          content.textContent = '데이터를 불러올 수 없습니다.';
        }
      }
    } else {
      row.style.display = 'none';
      btn.textContent   = '상세 보기';
    }
  }

  // ------------------------------------------------------------------
  // 파일 뷰어 모달 — <dialog> API 사용
  // ------------------------------------------------------------------
  let _rawContent   = '';
  let _matchIndexes = [];
  let _currentMatch = -1;

  const fileModal = document.getElementById('file-modal');

  async function openFileModal(filePath, hostname) {
    document.getElementById('modal-title').textContent  = hostname;
    document.getElementById('modal-search').value       = '';
    document.getElementById('search-count').textContent = '';
    document.getElementById('modal-body').innerHTML     =
      '<div class="modal-status">불러오는 중...</div>';

    // <dialog> 내장 showModal() — 자동으로 ::backdrop 적용 + focus trap
    fileModal.showModal();

    try {
      const res = await fetch(`/api/backup/file?path=${encodeURIComponent(filePath)}`);
      if (handle401(res)) { closeModal(); return; }

      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        document.getElementById('modal-body').innerHTML =
          `<div class="modal-status">${data.detail || '파일을 불러올 수 없습니다.'}</div>`;
        return;
      }

      const data  = await res.json();
      _rawContent = data.content;

      document.getElementById('modal-title').textContent =
        `${hostname}  ·  ${data.filename}`;

      renderContent(_rawContent);

    } catch (e) {
      document.getElementById('modal-body').innerHTML =
        '<div class="modal-status">파일을 불러올 수 없습니다.</div>';
    }
  }

  function closeModal() {
    fileModal.close();   // <dialog> 내장 close()
    _rawContent   = '';
    _matchIndexes = [];
    _currentMatch = -1;
  }

  // ::backdrop 클릭 시 닫기 (dialog 외부 클릭)
  fileModal.addEventListener('click', e => {
    const rect = fileModal.getBoundingClientRect();
    const isOutside =
      e.clientX < rect.left  || e.clientX > rect.right ||
      e.clientY < rect.top   || e.clientY > rect.bottom;
    if (isOutside) closeModal();
  });

  // ESC 키는 <dialog>가 기본으로 처리 (close 이벤트 발생)
  // 추가 정리 작업이 필요하면 cancel 이벤트로 처리
  fileModal.addEventListener('cancel', () => {
    _rawContent   = '';
    _matchIndexes = [];
    _currentMatch = -1;
  });

  // ------------------------------------------------------------------
  // 파일 내용 렌더링
  // ------------------------------------------------------------------
  function escapeHtml(text) {
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function renderContent(text, keyword = '', currentIdx = -1) {
    const body = document.getElementById('modal-body');

    if (!keyword) {
      body.innerHTML = `<pre class="file-content">${escapeHtml(text)}</pre>`;
      return;
    }

    const escaped   = escapeHtml(text);
    const escapedKw = escapeHtml(keyword);
    const regex     = new RegExp(escapedKw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');

    let matchCount = 0;
    const highlighted = escaped.replace(regex, match => {
      const isCurrent = matchCount === currentIdx;
      matchCount++;
      return `<mark class="${isCurrent ? 'current' : ''}" data-idx="${matchCount - 1}">${match}</mark>`;
    });

    body.innerHTML = `<pre class="file-content">${highlighted}</pre>`;

    if (currentIdx >= 0) {
      const currentMark = body.querySelector(`mark[data-idx="${currentIdx}"]`);
      if (currentMark) {
        currentMark.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    }
  }

  // ------------------------------------------------------------------
  // 인라인 검색
  // ------------------------------------------------------------------
  function onSearchInput() {
    const keyword = document.getElementById('modal-search').value;
    _currentMatch = keyword ? 0 : -1;
    _matchIndexes = [];

    if (keyword) {
      const regex   = new RegExp(keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
      const matches = _rawContent.match(regex);
      const total   = matches ? matches.length : 0;
      _matchIndexes = Array.from({ length: total }, (_, i) => i);
      _currentMatch = total > 0 ? 0 : -1;

      document.getElementById('search-count').textContent =
        total > 0 ? `1 / ${total}` : '없음';
    } else {
      document.getElementById('search-count').textContent = '';
    }

    renderContent(_rawContent, keyword, _currentMatch);
  }

  function onSearchKeydown(event) {
    if (event.key === 'Enter') {
      event.preventDefault();
      navigateSearch(event.shiftKey ? -1 : 1);
    }
  }

  function navigateSearch(direction) {
    const total = _matchIndexes.length;
    if (total === 0) return;

    _currentMatch = (_currentMatch + direction + total) % total;

    const keyword = document.getElementById('modal-search').value;
    document.getElementById('search-count').textContent =
      `${_currentMatch + 1} / ${total}`;

    renderContent(_rawContent, keyword, _currentMatch);
  }

  // ------------------------------------------------------------------
  // 초기 로드
  // ------------------------------------------------------------------
  loadHistory();
</script>
{% endblock %}
