{% extends "base.html" %}

{% block title %}백업 실행{% endblock %}

{% block head %}
<style>
  .page-title {
    margin-bottom: 24px;
  }

  /* 컨트롤 바 — 한 줄 레이아웃 */
  .control-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 9px 14px;
    outline: none;
    cursor: pointer;
    min-width: 130px;
  }

  select:focus { border-color: var(--accent); }

  .btn {
    padding: 9px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: opacity 0.15s;
    white-space: nowrap;
  }

  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary  { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { opacity: 0.85; }

  .btn-secondary {
    background: #2a2a2a;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover:not(:disabled) { background: #333; color: var(--text); }

  .selected-info {
    font-size: 13px;
    color: var(--text-muted);
    font-family: var(--mono);
    white-space: nowrap;
  }

  .selected-info span { color: var(--accent); font-weight: 600; }

  /* 장비 목록 박스 */
  .device-box {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
  }

  .device-box-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-muted);
  }

  .device-box-header input[type="checkbox"] {
    accent-color: var(--accent);
    cursor: pointer;
  }

  .device-box-header .count {
    margin-left: auto;
    font-family: var(--mono);
  }

  .device-col-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 16px;
    background: #111;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    font-weight: 600;
    color: #555;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .device-col-header .col-chk      { width: 15px; flex-shrink: 0; }
  .device-col-header .col-group    { width: 80px; flex-shrink: 0; text-align: center; }
  .device-col-header .col-hostname { width: 160px; flex-shrink: 0; text-align: center; }
  .device-col-header .col-ip       { width: 140px; flex-shrink: 0; text-align: center; }
  .device-col-header .col-type     { width: 120px; flex-shrink: 0; text-align: center; }
  .device-col-header .col-desc     { flex: 1; text-align: center; }

  .device-list {
    max-height: 260px;
    overflow-y: auto;
  }

  .device-list::-webkit-scrollbar { width: 6px; }
  .device-list::-webkit-scrollbar-track { background: transparent; }
  .device-list::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

  .device-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 16px;
    border-bottom: 1px solid #1a1a1a;
    font-size: 13px;
    font-family: var(--mono);
    transition: background 0.1s;
    cursor: pointer;
  }

  .device-item:last-child { border-bottom: none; }
  .device-item:hover    { background: #161616; }
  .device-item.selected { background: #0f1a2e; }

  .device-item input[type="checkbox"] {
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
    width: 15px;
  }

  .device-item .col-group    { width: 80px; flex-shrink: 0; text-align: center; }
  .device-item .col-hostname { color: var(--text); width: 160px; flex-shrink: 0; text-align: center; }
  .device-item .col-ip       { color: #888; width: 140px; flex-shrink: 0; text-align: center; }
  .device-item .col-type     { color: #555; width: 120px; flex-shrink: 0; text-align: center; }
  .device-item .col-desc     { color: #555; flex: 1; font-size: 12px; text-align: center; }

  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    font-family: var(--mono);
    text-transform: uppercase;
  }

  .badge-mgmt  { background: #1a2a1e; color: #4ade80; }
  .badge-nexus { background: #1e1a2a; color: #a78bfa; }
  .badge-aci   { background: #2a1e1a; color: #fb923c; }
  .badge-other { background: #1e2a3a; color: var(--accent); }

  .empty-msg {
    padding: 32px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }

  /* ── skeleton device-item 행 ── */
  .skeleton-device-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 16px;
    border-bottom: 1px solid #1a1a1a;
  }
  .skeleton-device-item:last-child { border-bottom: none; }

  /* 상태 바 */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border);
    flex-shrink: 0;
  }

  .dot.running {
    background: var(--accent);
    animation: pulse 1s infinite;
  }

  .dot.done { background: var(--success); }
  .dot.idle { background: var(--border); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }

  /* 로그 박스 */
  .log-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 12px 12px 0 0;
    background: var(--surface);
    font-size: 13px;
    font-weight: 600;
  }

  .btn-clear {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    padding: 4px 12px;
    font-size: 12px;
    font-family: 'Pretendard', sans-serif;
    cursor: pointer;
  }

  .btn-clear:hover { background: #2a2a2a; color: var(--text); }

  .log-box {
    background: #0a0a0a;
    border: 1px solid var(--border);
    border-radius: 0 0 12px 12px;
    padding: 20px 24px;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.8;
    min-height: 260px;
    max-height: 420px;
    overflow-y: auto;
    color: var(--text-muted);
  }

  .log-line { margin: 0; }
  .log-ok   { color: var(--success); }
  .log-fail { color: var(--danger); }
  .log-done { color: var(--accent); font-weight: 600; }
  .log-info { color: var(--text-muted); }
  .log-warn { color: #f59e0b; }

  /* ================================================================
     반응형 — v5.3
     ================================================================ */

  /* ── 태블릿 (768px ~ 1024px) ── */
  @media (max-width: 1024px) {
    /* hostname 컬럼 숨김 */
    .device-col-header .col-hostname,
    .device-item .col-hostname { display: none; }

    /* col 너비 축소 */
    .device-col-header .col-group,
    .device-item .col-group    { width: 70px; }

    .device-col-header .col-ip,
    .device-item .col-ip       { width: 120px; }

    .device-col-header .col-type,
    .device-item .col-type     { width: 100px; }
  }

  /* ── 모바일 (768px 미만) ── */
  @media (max-width: 768px) {
    /* type, desc 컬럼 추가 숨김 → 그룹 + IP만 표시 */
    .device-col-header .col-type,
    .device-item .col-type     { display: none; }

    .device-col-header .col-desc,
    .device-item .col-desc     { display: none; }

    /* IP 컬럼 너비 확장 */
    .device-col-header .col-ip,
    .device-item .col-ip       { width: auto; flex: 1; }

    /* skeleton도 동일하게 처리 */
    .skeleton-device-item .col-type,
    .skeleton-device-item .col-desc { display: none; }

    /* 컨트롤 바: 버튼 full width */
    .control-bar {
      flex-direction: column;
      align-items: stretch;
    }

    .control-bar select,
    .control-bar .btn { width: 100%; }

    .selected-info { text-align: center; }

    /* 로그 박스 높이 축소 */
    .log-box {
      min-height: 180px;
      max-height: 280px;
      padding: 14px 16px;
      font-size: 12px;
    }
  }
</style>
{% endblock %}

{% block content %}
<h1 class="page-title">백업 실행</h1>

<!-- 장비 선택 -->
<section aria-label="장비 선택">
  <!-- 컨트롤 바 -->
  <div class="control-bar">
    <select id="group-select" onchange="onGroupChange()">
      <option value="">전체 그룹</option>
      <option value="mgmt">MGMT</option>
      <option value="nexus">Nexus</option>
      <option value="aci">ACI</option>
    </select>

    <button class="btn btn-primary" id="run-btn" onclick="startBackup()">
      백업 시작
    </button>
    <button class="btn btn-secondary" id="stop-btn"
            onclick="stopBackup()" style="display:none;">
      로그 숨기기
    </button>

    <span class="selected-info" id="selected-info">선택 없음 — <span>전체 백업</span> 실행</span>
  </div>

  <!-- 장비 목록 박스 -->
  <div class="device-box">
    <div class="device-box-header">
      <input type="checkbox" id="check-all" onchange="toggleAll(this)">
      <span>장비 선택</span>
      <span style="color:#444;">— 선택 없으면 전체 백업</span>
      <span class="count" id="device-count">0대</span>
    </div>
    <div class="device-col-header">
      <span class="col-chk"></span>
      <span class="col-group">그룹</span>
      <span class="col-hostname">Host</span>
      <span class="col-ip">IP 주소</span>
      <span class="col-type">장비 타입</span>
      <span class="col-desc">설명</span>
    </div>
    <!-- skeleton: 5행 -->
    <div class="device-list" id="device-list">
      <div class="skeleton-device-item">
        <span style="width:15px;flex-shrink:0;"><div class="skeleton skeleton-cell" style="width:13px;height:13px;border-radius:3px;"></div></span>
        <span class="col-group"><div class="skeleton skeleton-badge"></div></span>
        <span class="col-hostname"><div class="skeleton skeleton-cell" style="width:110px;height:13px;"></div></span>
        <span class="col-ip"><div class="skeleton skeleton-cell" style="width:110px;height:13px;"></div></span>
        <span class="col-type"><div class="skeleton skeleton-cell" style="width:90px;height:13px;"></div></span>
        <span style="flex:1;text-align:center;"><div class="skeleton skeleton-cell" style="width:120px;height:12px;display:inline-block;"></div></span>
      </div>
      <div class="skeleton-device-item">
        <span style="width:15px;flex-shrink:0;"><div class="skeleton skeleton-cell" style="width:13px;height:13px;border-radius:3px;"></div></span>
        <span class="col-group"><div class="skeleton skeleton-badge"></div></span>
        <span class="col-hostname"><div class="skeleton skeleton-cell" style="width:110px;height:13px;"></div></span>
        <span class="col-ip"><div class="skeleton skeleton-cell" style="width:110px;height:13px;"></div></span>
        <span class="col-type"><div class="skeleton skeleton-cell" style="width:90px;height:13px;"></div></span>
        <span style="flex:1;text-align:center;"><div class="skeleton skeleton-cell" style="width:90px;height:12px;display:inline-block;"></div></span>
      </div>
      <div class="skeleton-device-item">
        <span style="width:15px;flex-shrink:0;"><div class="skeleton skeleton-cell" style="width:13px;height:13px;border-radius:3px;"></div></span>
        <span class="col-group"><div class="skeleton skeleton-badge"></div></span>
        <span class="col-hostname"><div class="skeleton skeleton-cell" style="width:110px;height:13px;"></div></span>
        <span class="col-ip"><div class="skeleton skeleton-cell" style="width:110px;height:13px;"></div></span>
        <span class="col-type"><div class="skeleton skeleton-cell" style="width:90px;height:13px;"></div></span>
        <span style="flex:1;text-align:center;"><div class="skeleton skeleton-cell" style="width:140px;height:12px;display:inline-block;"></div></span>
      </div>
      <div class="skeleton-device-item">
        <span style="width:15px;flex-shrink:0;"><div class="skeleton skeleton-cell" style="width:13px;height:13px;border-radius:3px;"></div></span>
        <span class="col-group"><div class="skeleton skeleton-badge"></div></span>
        <span class="col-hostname"><div class="skeleton skeleton-cell" style="width:110px;height:13px;"></div></span>
        <span class="col-ip"><div class="skeleton skeleton-cell" style="width:110px;height:13px;"></div></span>
        <span class="col-type"><div class="skeleton skeleton-cell" style="width:90px;height:13px;"></div></span>
        <span style="flex:1;text-align:center;"><div class="skeleton skeleton-cell" style="width:100px;height:12px;display:inline-block;"></div></span>
      </div>
      <div class="skeleton-device-item">
        <span style="width:15px;flex-shrink:0;"><div class="skeleton skeleton-cell" style="width:13px;height:13px;border-radius:3px;"></div></span>
        <span class="col-group"><div class="skeleton skeleton-badge"></div></span>
        <span class="col-hostname"><div class="skeleton skeleton-cell" style="width:110px;height:13px;"></div></span>
        <span class="col-ip"><div class="skeleton skeleton-cell" style="width:110px;height:13px;"></div></span>
        <span class="col-type"><div class="skeleton skeleton-cell" style="width:90px;height:13px;"></div></span>
        <span style="flex:1;text-align:center;"><div class="skeleton skeleton-cell" style="width:78px;height:12px;display:inline-block;"></div></span>
      </div>
    </div>
  </div>
</section>

<!-- 실시간 로그 -->
<section aria-label="실시간 로그">
  <div class="status-bar">
    <div class="dot idle" id="status-dot"></div>
    <span id="status-text">대기 중</span>
  </div>

  <div class="log-header">
    <span>실시간 로그</span>
    <button class="btn-clear" onclick="clearLog()">지우기</button>
  </div>
  <div class="log-box" id="log-box">
    <p class="log-line log-info">장비를 선택하거나 선택 없이 전체 백업을 실행하세요.</p>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
  let ws = null;
  let currentRunId = null;
  let isDone = false;
  let retryCount = 0;
  const MAX_RETRY = 5;

  let _allDevices = [];

  const SKEL_DEVICE_ITEM = `
    <div class="skeleton-device-item">
      <span style="width:15px;flex-shrink:0;"><div class="skeleton skeleton-cell" style="width:13px;height:13px;border-radius:3px;"></div></span>
      <span class="col-group"><div class="skeleton skeleton-badge"></div></span>
      <span class="col-hostname"><div class="skeleton skeleton-cell" style="width:110px;height:13px;"></div></span>
      <span class="col-ip"><div class="skeleton skeleton-cell" style="width:110px;height:13px;"></div></span>
      <span class="col-type"><div class="skeleton skeleton-cell" style="width:90px;height:13px;"></div></span>
      <span style="flex:1;text-align:center;"><div class="skeleton skeleton-cell" style="width:110px;height:12px;display:inline-block;"></div></span>
    </div>`;

  // ------------------------------------------------------------------
  // 초기화
  // ------------------------------------------------------------------
  async function loadDevices() {
    try {
      const res = await fetch('/api/devices');
      if (handle401(res)) return;
      if (!res.ok) {
        renderError('장비 목록을 불러오지 못했습니다.');
        return;
      }
      _allDevices = await res.json();
      renderList(_allDevices);
    } catch (err) {
      renderError(`오류: ${err}`);
    }
  }

  // ------------------------------------------------------------------
  // 그룹 select 변경
  // ------------------------------------------------------------------
  function onGroupChange() {
    const group = document.getElementById('group-select').value;

    document.getElementById('device-list').innerHTML = SKEL_DEVICE_ITEM.repeat(4);

    const filtered = group
      ? _allDevices.filter(d => d.group_name === group)
      : _allDevices;
    renderList(filtered);
    updateSelectedInfo();
  }

  // ------------------------------------------------------------------
  // 장비 목록 렌더링
  // ------------------------------------------------------------------
  function badgeClass(group) {
    const map = { mgmt: 'badge-mgmt', nexus: 'badge-nexus', aci: 'badge-aci' };
    return map[group] || 'badge-other';
  }

  function renderList(devices) {
    const container = document.getElementById('device-list');
    const countEl   = document.getElementById('device-count');
    const checkAll  = document.getElementById('check-all');

    checkAll.checked = false;

    if (devices.length === 0) {
      container.innerHTML = '<div class="empty-msg">해당 그룹에 장비가 없습니다.</div>';
      countEl.textContent = '0대';
      return;
    }

    container.innerHTML = devices.map(d => `
      <div class="device-item" onclick="toggleItem(this)">
        <input type="checkbox" class="device-check"
               value="${d.ip}" onchange="updateSelectedInfo()" onclick="event.stopPropagation()">
        <span class="col-group">
          <span class="badge ${badgeClass(d.group_name)}">${d.group_name}</span>
        </span>
        <span class="col-hostname">${d.last_hostname || '–'}</span>
        <span class="col-ip">${d.ip}</span>
        <span class="col-type">${d.device_type}</span>
        <span class="col-desc">${d.description || '–'}</span>
      </div>
    `).join('');

    countEl.textContent = `${devices.length}대`;
    updateSelectedInfo();
  }

  function renderError(msg) {
    document.getElementById('device-list').innerHTML =
      `<div class="empty-msg" style="color:var(--danger);">${msg}</div>`;
  }

  // ------------------------------------------------------------------
  // 체크박스
  // ------------------------------------------------------------------
  function toggleItem(row) {
    const cb = row.querySelector('.device-check');
    cb.checked = !cb.checked;
    row.classList.toggle('selected', cb.checked);
    updateSelectedInfo();
  }

  function toggleAll(master) {
    document.querySelectorAll('.device-check').forEach(cb => {
      cb.checked = master.checked;
      cb.closest('.device-item').classList.toggle('selected', master.checked);
    });
    updateSelectedInfo();
  }

  function updateSelectedInfo() {
    const checked = getSelectedIps();
    const total   = document.querySelectorAll('.device-check').length;
    const el      = document.getElementById('selected-info');

    document.getElementById('check-all').checked =
      total > 0 && checked.length === total;

    el.innerHTML = checked.length === 0
      ? '선택 없음 — <span>전체 백업</span> 실행'
      : `<span>${checked.length}대</span> 선택됨`;
  }

  function getSelectedIps() {
    return Array.from(
      document.querySelectorAll('.device-check:checked')
    ).map(cb => cb.value);
  }

  // ------------------------------------------------------------------
  // 백업 시작
  // ------------------------------------------------------------------
  async function startBackup() {
    const selectedIps = getSelectedIps();
    const group       = document.getElementById('group-select').value || null;
    const targetIps   = selectedIps.length > 0 ? selectedIps : null;

    isDone       = false;
    retryCount   = 0;
    currentRunId = null;

    document.getElementById('run-btn').disabled = true;
    document.getElementById('stop-btn').style.display = 'inline-block';
    setStatus('running', '백업 실행 중...');
    clearLog();

    try {
      const res = await fetch('/api/backup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ group: group, target_ips: targetIps }),
      });

      if (handle401(res)) { resetUI(); return; }

      if (res.status === 409) {
        appendLog('이미 백업이 실행 중입니다. 완료 후 다시 시도하세요.', 'log-warn');
        resetUI();
        return;
      }

      if (!res.ok) {
        appendLog(`백업 요청 실패: HTTP ${res.status}`, 'log-fail');
        resetUI();
        return;
      }

      const data   = await res.json();
      currentRunId = data.run_id;

      const scope = targetIps
        ? `${targetIps.length}대 선택 백업`
        : (group ? `${group} 그룹 전체 백업` : '전체 백업');
      appendLog(`백업 작업 등록 완료 | run_id=${currentRunId} | ${scope}`, 'log-info');
      connectWebSocket(currentRunId);

    } catch (err) {
      appendLog(`요청 오류: ${err}`, 'log-fail');
      resetUI();
    }
  }

  // ------------------------------------------------------------------
  // WebSocket
  // ------------------------------------------------------------------
  function connectWebSocket(runId) {
    const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${protocol}://${location.host}/api/backup/ws/${runId}`);

    ws.onmessage = (event) => {
      const payload = JSON.parse(event.data);
      const level   = payload.level   || 'INFO';
      const message = payload.message || '';

      if (level === 'DONE') {
        isDone = true;
        appendLog('━━━ 백업 완료 ━━━', 'log-done');
        setStatus('done', '완료');
        resetUI();
        ws.close();
        return;
      }

      if (message.includes('[OK')) {
        appendLog(message, 'log-ok');
      } else if (message.includes('[FAIL]') || message.includes('[ERROR]')) {
        appendLog(message, 'log-fail');
      } else {
        appendLog(message, 'log-info');
      }
    };

    ws.onerror = () => appendLog('WebSocket 오류 발생', 'log-warn');

    ws.onclose = () => {
      if (isDone || currentRunId === null) return;
      if (retryCount < MAX_RETRY) {
        retryCount++;
        appendLog(
          `WebSocket 연결 끊김 — ${retryCount}초 후 재연결 시도 (${retryCount}/${MAX_RETRY})`,
          'log-warn'
        );
        setTimeout(() => connectWebSocket(runId), retryCount * 1000);
      } else {
        appendLog('WebSocket 재연결 실패 — 백업은 서버에서 계속 실행 중입니다.', 'log-fail');
        appendLog('잠시 후 이력 페이지에서 확인하세요.', 'log-warn');
        resetUI();
      }
    };
  }

  // ------------------------------------------------------------------
  // 로그 숨기기
  // ------------------------------------------------------------------
  function stopBackup() {
    isDone       = true;
    currentRunId = null;
    if (ws) ws.close();
    appendLog('── 로그 수신을 중단했습니다. 백업은 서버에서 계속 실행 중입니다. ──', 'log-warn');
    appendLog('── 결과는 백업 이력 페이지에서 확인하세요. ──', 'log-warn');
    setStatus('idle', '로그 숨김');
    resetUI();
  }

  // ------------------------------------------------------------------
  // UI 헬퍼
  // ------------------------------------------------------------------
  function appendLog(msg, cls) {
    const logBox = document.getElementById('log-box');
    const p = document.createElement('p');
    p.className = `log-line ${cls}`;
    p.textContent = msg;
    logBox.appendChild(p);
    logBox.scrollTop = logBox.scrollHeight;
  }

  function clearLog() {
    document.getElementById('log-box').innerHTML =
      '<p class="log-line log-info">장비를 선택하거나 선택 없이 전체 백업을 실행하세요.</p>';
  }

  function setStatus(state, text) {
    document.getElementById('status-dot').className = `dot ${state}`;
    document.getElementById('status-text').textContent = text;
  }

  function resetUI() {
    document.getElementById('run-btn').disabled = false;
    document.getElementById('stop-btn').style.display = 'none';
  }

  loadDevices();
</script>
{% endblock %}
