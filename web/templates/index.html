{% extends "base.html" %}

{% block title %}대시보드{% endblock %}

{% block head %}
<style>
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 32px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    border-top: 3px solid var(--accent);
    transition: transform 0.15s;
  }

  .stat-card:hover { transform: translateY(-3px); }
  .stat-card.success { border-top-color: var(--success); }
  .stat-card.danger  { border-top-color: var(--danger); }
  .stat-card.neutral { border-top-color: #888; }

  .stat-label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .stat-value {
    font-family: var(--mono);
    font-size: 38px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }

  .stat-sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  /* 차트 영역 */
  .chart-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 32px;
  }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
  }

  .chart-title {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 16px;
  }

  .chart-wrap {
    position: relative;
    height: 200px;
  }

  /* 이력 테이블 */
  .page-title { margin-bottom: 24px; }

  .recent-header {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 16px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th {
    text-align: left;
    padding: 10px 14px;
    color: var(--text-muted);
    font-weight: 500;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  td {
    padding: 12px 14px;
    border-bottom: 1px solid #1f1f1f;
    font-family: var(--mono);
    font-size: 13px;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #1f1f1f; }

  .empty {
    text-align: center;
    padding: 48px;
    color: var(--text-muted);
    font-size: 14px;
  }
</style>
{% endblock %}

{% block content %}
<h1 class="page-title">대시보드</h1>

<!-- Stat 카드 -->
<div class="stat-grid">
  <div class="stat-card">
    <div class="stat-label">전체 장비</div>
    <div class="stat-value" id="val-total">—</div>
    <div class="stat-sub">최근 실행 기준</div>
  </div>
  <div class="stat-card success">
    <div class="stat-label">성공</div>
    <div class="stat-value" id="val-success">—</div>
    <div class="stat-sub" id="sub-success">&nbsp;</div>
  </div>
  <div class="stat-card danger">
    <div class="stat-label">실패</div>
    <div class="stat-value" id="val-fail">—</div>
    <div class="stat-sub" id="sub-fail">&nbsp;</div>
  </div>
  <div class="stat-card neutral">
    <div class="stat-label">마지막 실행</div>
    <div class="stat-value" style="font-size:20px;" id="val-time">—</div>
    <div class="stat-sub" id="sub-time">&nbsp;</div>
  </div>
</div>

<!-- 차트 영역 -->
<div class="chart-grid">
  <!-- 백업 현황 차트 -->
  <div class="chart-card">
    <div class="chart-title">최근 7일 백업 현황</div>
    <div class="chart-wrap">
      <canvas id="chart-backup"></canvas>
    </div>
  </div>
  <!-- Config Diff 차트 -->
  <div class="chart-card">
    <div class="chart-title">최근 7일 Config 변경 감지</div>
    <div class="chart-wrap">
      <canvas id="chart-diff"></canvas>
    </div>
  </div>
</div>

<!-- 최근 이력 테이블 -->
<div class="card">
  <div class="recent-header">최근 백업 이력</div>
  <table>
    <thead>
      <tr>
        <th>RUN #</th>
        <th>실행 시각</th>
        <th>완료 시각</th>
        <th>전체</th>
        <th>성공</th>
        <th>실패</th>
      </tr>
    </thead>
    <tbody id="history-tbody">
      <tr><td colspan="6" class="empty">데이터 로딩 중...</td></tr>
    </tbody>
  </table>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
  // ------------------------------------------------------------------
  // 공통 — 최근 7일 날짜 레이블 생성 (오늘 포함)
  // ------------------------------------------------------------------
  function getLast7Days() {
    const labels = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      // MM/DD 형식
      labels.push(`${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`);
    }
    return labels;
  }

  // ISO 문자열 → MM/DD
  function toDateLabel(isoStr) {
    const d = new Date(isoStr);
    return `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
  }

  // ------------------------------------------------------------------
  // 백업 현황 차트
  // ------------------------------------------------------------------
  function renderBackupChart(runs) {
    const labels  = getLast7Days();

    // 날짜별 성공/실패 집계
    const successMap = Object.fromEntries(labels.map(l => [l, 0]));
    const failMap    = Object.fromEntries(labels.map(l => [l, 0]));

    runs.forEach(r => {
      const label = toDateLabel(r.run_at);
      if (label in successMap) {
        successMap[label] += r.success;
        failMap[label]    += r.fail;
      }
    });

    new Chart(document.getElementById('chart-backup'), {
      type: 'bar',
      data: {
        labels,
        datasets: [
          {
            label: '성공',
            data: labels.map(l => successMap[l]),
            backgroundColor: 'rgba(34, 197, 94, 0.7)',
            borderRadius: 4,
            borderSkipped: false,
          },
          {
            label: '실패',
            data: labels.map(l => failMap[l]),
            backgroundColor: 'rgba(239, 68, 68, 0.7)',
            borderRadius: 4,
            borderSkipped: false,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            labels: { color: '#888', font: { size: 11 } },
          },
        },
        scales: {
          x: {
            stacked: true,
            ticks: { color: '#666', font: { size: 11 } },
            grid:  { color: '#1f1f1f' },
          },
          y: {
            stacked: true,
            beginAtZero: true,
            ticks: {
              color: '#666',
              font: { size: 11 },
              precision: 0,
            },
            grid: { color: '#1f1f1f' },
          },
        },
      },
    });
  }

  // ------------------------------------------------------------------
  // Config Diff 차트
  // ------------------------------------------------------------------
  function renderDiffChart(diffs) {
    const labels  = getLast7Days();
    const diffMap = Object.fromEntries(labels.map(l => [l, 0]));

    diffs.forEach(d => {
      const label = toDateLabel(d.detected_at);
      if (label in diffMap) {
        diffMap[label] += 1;
      }
    });

    new Chart(document.getElementById('chart-diff'), {
      type: 'bar',
      data: {
        labels,
        datasets: [
          {
            label: 'Config 변경',
            data: labels.map(l => diffMap[l]),
            backgroundColor: 'rgba(59, 130, 246, 0.7)',
            borderRadius: 4,
            borderSkipped: false,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            labels: { color: '#888', font: { size: 11 } },
          },
        },
        scales: {
          x: {
            ticks: { color: '#666', font: { size: 11 } },
            grid:  { color: '#1f1f1f' },
          },
          y: {
            beginAtZero: true,
            ticks: {
              color: '#666',
              font: { size: 11 },
              precision: 0,
            },
            grid: { color: '#1f1f1f' },
          },
        },
      },
    });
  }

  // ------------------------------------------------------------------
  // 대시보드 로드
  // ------------------------------------------------------------------
  async function loadDashboard() {
    try {
      // 백업 이력 + Diff 이력 병렬 호출
      const [histRes, diffRes] = await Promise.all([
        fetch('/api/history?limit=50'),
        fetch('/api/diff?limit=100'),
      ]);

      if (handle401(histRes)) return;

      const runs  = await histRes.json();
      const diffs = await diffRes.json();

      // Stat 카드 — 가장 최근 run 기준
      if (runs.length) {
        const latest = runs[0];
        document.getElementById('val-total').textContent   = latest.total;
        document.getElementById('val-success').textContent = latest.success;
        document.getElementById('val-fail').textContent    = latest.fail;

        const runAt = latest.run_at.slice(0, 16).replace('T', ' ');
        document.getElementById('val-time').textContent = runAt;
        document.getElementById('sub-time').textContent = `RUN #${latest.run_id}`;

        const successRate = latest.total
          ? Math.round(latest.success / latest.total * 100) : 0;
        document.getElementById('sub-success').textContent = `성공률 ${successRate}%`;
        document.getElementById('sub-fail').textContent =
          latest.fail > 0 ? '확인 필요' : '이상 없음';
      } else {
        ['val-total', 'val-success', 'val-fail', 'val-time'].forEach(id => {
          document.getElementById(id).textContent = '0';
        });
      }

      // 차트 렌더링
      renderBackupChart(runs);
      renderDiffChart(diffs);

      // 이력 테이블 (최근 5건)
      const tbody = document.getElementById('history-tbody');
      if (!runs.length) {
        tbody.innerHTML =
          '<tr><td colspan="6" class="empty">백업 이력이 없습니다.</td></tr>';
        return;
      }

      tbody.innerHTML = runs.slice(0, 5).map(r => {
        const runAt  = r.run_at.slice(0, 19).replace('T', ' ');
        const finAt  = r.finished_at
          ? r.finished_at.slice(0, 19).replace('T', ' ') : '—';
        const failBadge = r.fail > 0
          ? `<span class="badge badge-danger">${r.fail}</span>`
          : `<span class="badge badge-success">0</span>`;
        return `
          <tr>
            <td>#${r.run_id}</td>
            <td>${runAt}</td>
            <td>${finAt}</td>
            <td>${r.total}</td>
            <td><span class="badge badge-success">${r.success}</span></td>
            <td>${failBadge}</td>
          </tr>`;
      }).join('');

    } catch (e) {
      document.getElementById('history-tbody').innerHTML =
        '<tr><td colspan="6" class="empty">데이터를 불러올 수 없습니다.</td></tr>';
    }
  }

  loadDashboard();
</script>
{% endblock %}
